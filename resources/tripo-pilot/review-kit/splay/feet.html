<!doctype html><html><body style="margin:0;background:#bbb">
<script type="importmap">{"imports":{"three":"./three.module.js","three/addons/":"./jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const P=new URLSearchParams(location.search); const files=P.get('f').split(','), clip=P.get('clip'), times=(P.get('t')||'').split(',').filter(Boolean).map(Number), cut=+(P.get('cut')||0.1), half=+(P.get('half')||0.3);
const cols=Math.max(files.length,times.length||1), W=1260, cw=W/cols, H=Math.round(cw);
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); r.setSize(W,H); document.body.appendChild(r.domElement); r.setScissorTest(true); r.localClippingEnabled=true;
const plane=new THREE.Plane(new THREE.Vector3(0,-1,0),cut);
let i=0;
for(const f of (times.length?times.map(()=>files[0]):files)){ const g=await new GLTFLoader().loadAsync(f); const scene=new THREE.Scene(); scene.background=new THREE.Color(0xc8c8c8); scene.add(new THREE.HemisphereLight(0xffffff,0x888888,1.3)); const dl=new THREE.DirectionalLight(0xffffff,1.2); dl.position.set(0.5,2,1); scene.add(dl); scene.add(g.scene);
  g.scene.traverse(o=>{ if(o.isMesh){ o.frustumCulled=false; (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{m.clippingPlanes=[plane]; m.side=THREE.DoubleSide;}); } });
  if(clip){ const mx=new THREE.AnimationMixer(g.scene); const c=g.animations.find(a=>a.name===clip); mx.clipAction(c).play(); mx.setTime(times.length?times[i]:0); }
  else g.scene.traverse(o=>{ if(o.isSkinnedMesh)o.skeleton.pose(); });
  g.scene.updateMatrixWorld(true);
  // lines: straight ahead through each ankle
  let fl=null,fr=null; g.scene.traverse(o=>{ if(o.name==='footL')fl=o; if(o.name==='footR')fr=o; });
  for(const b of [fl,fr]){ const p=b.getWorldPosition(new THREE.Vector3()); const geo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(p.x,cut+0.01,p.z-0.05),new THREE.Vector3(p.x,cut+0.01,p.z+0.25)]); scene.add(new THREE.Line(geo,new THREE.LineBasicMaterial({color:0xcc2222}))); }
  try{ const m=await (await fetch(f.replace('.glb','.json'))).json(); if(!clip)for(const s of ['L','R']){ const a=m.alt[s]; const geo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(a.heel[0],cut+0.02,a.heel[1]),new THREE.Vector3(a.toe[0],cut+0.02,a.toe[1])]); scene.add(new THREE.Line(geo,new THREE.LineBasicMaterial({color:0x1133ee}))); } }catch(e){}
  const cam=new THREE.OrthographicCamera(-half,half,half,-half,0.01,10); cam.position.set(0,3,0.06); cam.up.set(0,0,1); cam.lookAt(0,0,0.06);   // seen from above, her front toward the top of the picture, her left on the picture's left... 
  r.setViewport(i*cw,0,cw,H); r.setScissor(i*cw,0,cw,H); r.render(scene,cam); i++; }
window.done=true;
</script></body></html>
